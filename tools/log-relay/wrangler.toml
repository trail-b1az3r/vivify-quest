# Vivify Send Logs API and static dashboard. See README.md.
name = "vivify-log-relay"
main = "worker.js"
compatibility_date = "2026-11-16"

[triggers]
crons = ["17 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
REPO = "trail-b1az3r/vivify-quest"
BRANCH = "LOGS"
# Active LOGS branch budget; when exceeded, all logs older than two hours are pruned.
MAX_LOG_STORAGE_BYTES = "471859200"
# GITHUB_TOKEN is a secret: npx wrangler secret put GITHUB_TOKEN
