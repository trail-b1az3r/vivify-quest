name: Build Quest Mod

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version number (optional, defaults to mod.json version)'
        required: false
        default: ''
      release:
        description: 'Publish a GitHub release for this build'
        type: boolean
        required: false
        default: false
      dependency_source:
        description: 'Where to resolve dependencies from'
        type: choice
        required: false
        default: auto
        options:
          - auto        # github manifest if complete, else qpackages.com
          - github      # scripts/restore-deps.py only; fail if incomplete
          - qpackages   # qpm restore only (qpackages.com)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    # Three ways to get dependencies:
    #   auto       scripts/restore-deps.py -- GitHub where the manifest has a
    #              repo, qpackages.com for the rest (default; push/PR runs)
    #   github     scripts/restore-deps.py --no-qpackages -- GitHub only, and
    #              fails rather than touching the registry
    #   qpackages  `qpm restore` only
    # See scripts/README-deps.md.
    - name: Choose dependency source
      id: deps
      run: |
        requested="${{ github.event.inputs.dependency_source }}"
        # push/PR runs carry no input; an explicit if avoids the `[ ... ] && x`
        # exit-status trap, since Actions runs this step under `bash -e`.
        if [ -z "$requested" ]; then requested=auto; fi

        case "$requested" in
          qpackages)
            source=qpackages
            reason="requested explicitly" ;;
          github)
            source=github
            reason="requested explicitly"
            # Must fail loudly on a manifest that still needs the registry.
            python3 scripts/restore-deps.py --check --no-qpackages || exit 1 ;;
          *)
            source=auto
            reason="GitHub where available, qpackages.com for the remainder"
            python3 scripts/restore-deps.py --check || exit 1 ;;
        esac

        echo "source=$source" >> "$GITHUB_OUTPUT"
        echo "use_qpm=$([ "$source" = qpackages ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        echo "Dependency source: **$source** ($reason)" >> "$GITHUB_STEP_SUMMARY"
        echo "Dependency source: $source ($reason)"

    # qpm-action saves ~/.local/share/QPM-RS/cache after it resolves the NDK
    # whenever `cache` is on, whether or not `restore` ran. With restore off
    # (every source but qpackages) nothing creates that directory, so the save
    # fails with "Path Validation Error" and takes the whole step down. It only
    # ever passed while an older qpm-cache-* entry was being restored into it;
    # once that entry was evicted every build failed before compiling anything.
    # A placeholder file keeps the directory non-empty so the save has something
    # to archive.
    - name: Create the QPM cache directory qpm-action saves
      run: |
        mkdir -p "$HOME/.local/share/QPM-RS/cache"
        touch "$HOME/.local/share/QPM-RS/cache/.keep"

    - name: QPM Action
      id: qpm
      uses: Fernthedev/qpm-action@v1
      with:
        workflow_token: ${{ secrets.GITHUB_TOKEN }}
        # Only restores from qpackages.com when that source was selected;
        # otherwise this step is here purely for the Android NDK.
        restore: ${{ steps.deps.outputs.use_qpm }}
        cache: true
        resolve_ndk: true

    - name: Restore dependencies (GitHub only)
      if: steps.deps.outputs.source == 'github'
      run: python3 scripts/restore-deps.py --no-qpackages

    - name: Restore dependencies (GitHub, qpackages.com for the remainder)
      if: steps.deps.outputs.source == 'auto'
      run: python3 scripts/restore-deps.py

    # Two QMODs from one checkout, both published on a release:
    #   Vivify-v<version>.qmod       the full build, every feature
    #   Vivify-Lite-v<version>.qmod  the feature set of 0.14.7 (VIVIFY_LITE=1,
    #                                see include/main.hpp)
    # Both keep mod id "vivify", so they share one settings file; install one.
    - name: Build the full mod
      run: qpm s build

    - name: Check the full library's dependencies can be satisfied on device
      run: |
        so=$(find build -name 'libVivify.so' -print -quit)
        if [ -z "$so" ]; then
          echo "::error::no libVivify.so was produced"
          exit 1
        fi
        python3 scripts/check-so-dependencies.py "$so"

    - name: Create the full QMOD
      run: qpm s qmod

    - name: Read mod version
      id: mod_version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=$(python3 -c "import json; print(json.load(open('mod.json'))['version'])")
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Name the full QMOD
      run: |
        shopt -s nullglob
        built=(./*.qmod)
        if [ ${#built[@]} -eq 0 ]; then
          echo "::error::qpm s qmod produced no .qmod file"
          exit 1
        fi
        mv "${built[0]}" "./Vivify-v${{ steps.mod_version.outputs.version }}.qmod"

    # A fresh build directory: CMake caches VIVIFY_LITE from the first build.
    - name: Clear the build directory for the lite build
      run: rm -rf build

    - name: Build the lite mod
      env:
        VIVIFY_LITE: '1'
      run: qpm s build

    - name: Check the lite library's dependencies can be satisfied on device
      run: |
        so=$(find build -name 'libVivify.so' -print -quit)
        if [ -z "$so" ]; then
          echo "::error::no libVivify.so was produced"
          exit 1
        fi
        python3 scripts/check-so-dependencies.py "$so"

    # The lite QMOD takes its name from mod.json, so the two can be told apart
    # in a mod manager. mod.json is restored straight after.
    - name: Create the lite QMOD
      run: |
        python3 - <<'PY'
        import json
        m = json.load(open('mod.json'))
        m['name'] = 'Vivify Lite'
        json.dump(m, open('mod.json', 'w'), indent=2)
        PY
        qpm s qmod
        git checkout -- mod.json

    # The full QMOD, already named, sits beside the new one; every other
    # .qmod here is the lite build.
    - name: Name the lite QMOD
      run: |
        shopt -s nullglob
        full="./Vivify-v${{ steps.mod_version.outputs.version }}.qmod"
        built=()
        for file in ./*.qmod; do
          [ "$file" != "$full" ] && built+=("$file")
        done
        if [ ${#built[@]} -ne 1 ]; then
          echo "::error::expected one lite .qmod besides $full, found ${#built[@]}"
          exit 1
        fi
        mv "${built[0]}" "./Vivify-Lite-v${{ steps.mod_version.outputs.version }}.qmod"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Vivify-v${{ steps.mod_version.outputs.version }}
        path: |
          ./Vivify-v${{ steps.mod_version.outputs.version }}.qmod
          ./Vivify-Lite-v${{ steps.mod_version.outputs.version }}.qmod
        if-no-files-found: error

    # Fires on a v* tag push, and on a manual run with `release` ticked.
    # Without the second case a workflow_dispatch build could only ever produce
    # an artifact, never a release.
    - name: Publish Release
      if: >-
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        github.event.inputs.release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        # A tag push releases under the tag that was pushed; a manual run tags
        # from the version, creating the tag if it does not exist yet.
        tag_name: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) && github.ref_name || format('v{0}', steps.mod_version.outputs.version) }}
        name: Vivify ${{ steps.mod_version.outputs.version }}
        generate_release_notes: true
        body: |
          Personal Quest build of Vivify (merge of axo-lotl/Vivifhy-Quest,
          rbatteries1-design/Vivify-Quest-Port, and Lars27110/Vivify-Quest —
          see README for what was merged from each).

          Two downloads:
          - **Vivify-v${{ steps.mod_version.outputs.version }}.qmod**: full build, every feature.
          - **Vivify-Lite-v${{ steps.mod_version.outputs.version }}.qmod**: the feature set of 0.14.7
            (plus the geometry-shader setting). Install one or the other, not both.

          Built from `${{ github.ref_name }}` (dependency source:
          ${{ steps.deps.outputs.source }}).
        files: |
          ./Vivify-v${{ steps.mod_version.outputs.version }}.qmod
          ./Vivify-Lite-v${{ steps.mod_version.outputs.version }}.qmod
