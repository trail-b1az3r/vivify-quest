name: Level / Gameplay Bug - No PC / No Vivify Log
description: Report a Vivify Quest problem when you do not have access to a PC/computer or cannot provide a Vivify log.
title: "[BUG][NO LOG] "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        ## Vivify Quest Bug Report - No PC / No Vivify Log

        Use this form only if you genuinely cannot provide a Vivify debug/session log because you do not have access to a PC/computer.

        Your report must contain MORE THAN 1000 CHARACTERS of useful information.

        Include as much detail as possible: exact level/map, Vivify Quest version, Quest headset, other installed mods, exact symptoms, what happened immediately before the problem, steps to reproduce, approximate song time or location, what you expected, what actually happened, and screenshots or video if available.

        Do not use this form simply to avoid providing a Vivify log when you have access to a PC/computer.

  - type: input
    id: level
    attributes:
      label: Level(s) affected
      description: Give the name of every level/map where this happens. If it happens on every level, enter "All levels".
      placeholder: "Example: Camellia - Exit This Earth's Atomosphere"
    validations:
      required: true

  - type: textarea
    id: detailed-report
    attributes:
      label: Detailed report
      description: "REQUIRED: Write MORE THAN 1000 CHARACTERS of useful information. Explain the problem, expected behavior, reproduction steps, timing, settings, and anything else that could help diagnose it."
      placeholder: Write your complete report here. Your report must be longer than 1000 characters and contain useful technical and reproduction information.
    validations:
      required: true

  - type: input
    id: vivify-version
    attributes:
      label: Vivify Quest version
      description: Enter the exact Vivify Quest version you were using.
      placeholder: "Example: 0.9.14"
    validations:
      required: true

  - type: dropdown
    id: headset
    attributes:
      label: Quest headset
      description: Which headset did this happen on?
      options:
        - Quest 2
        - Quest 3
        - Quest 3S
        - Quest Pro
        - Other
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: List other installed mods that could be relevant. If none, write "None".
      placeholder: |
        Chroma
        Noodle Extensions
        Camera2
        Mapping Extensions
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / video
      description: Optional screenshots or video showing the problem.
      placeholder: Drag screenshots/videos here or paste links.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Required checks
      options:
        - label: I do not have access to a PC/computer and therefore cannot provide a Vivify debug/session log.
          required: true
        - label: I have searched existing issues and could not find the same problem.
          required: true
        - label: I am using a supported/recent version of Vivify Quest, or I have explained why I am reporting an older version.
          required: true
        - label: The information in this report is accurate to the best of my knowledge.
          required: true
