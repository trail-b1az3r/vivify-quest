name: Level / Gameplay Bug
description: Report a Vivify Quest problem affecting a specific level, map, effect, or gameplay session.
title: "[BUG] "
labels:
  - bug
  - needs-log
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        ## Vivify Quest Bug Report

        Thanks for reporting a problem with Vivify Quest!

        Please provide as much information as possible. **A log from Anb is required** for this template. Issues without a log or a direct link to a log may be closed or returned for more information.

        > **Please do not paste an enormous log directly into the issue.**
        > Upload the log as a file or provide a direct link to the uploaded log instead.

  - type: input
    id: level
    attributes:
      label: Level(s) affected
      description: |
        Give the name of every level/map where this happens.
        If it happens on every level, enter "All levels".
      placeholder: "Example: Camellia - Exit This Earth's Atomosphere"
    validations:
      required: true

  - type: textarea
    id: bug
    attributes:
      label: What happened?
      description: Clearly describe the problem and what you saw happen.
      placeholder: |
        Example:
        When the map starts, the Vivify effect appears for a few seconds,
        then the screen becomes black while notes continue rendering.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: Describe the expected behavior.
      placeholder: |
        Example:
        The Vivify effect should remain visible throughout the section
        without making the gameplay view black.
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: possible Steps to reproduce
      description: Give the shortest reliable way to reproduce the problem.
      placeholder: |
        1. Open the level
        2. Start the song
        3. Reach approximately 1:32
        4. The screen becomes black
    validations:
      required: true

  - type: input
    id: vivify-version
    attributes:
      label: Vivify Quest version
      description: Enter the exact Vivify Quest version you were using.
      placeholder: "Example: 0.9.14"
    validations:
      required: true

  - type: dropdown
    id: headset
    attributes:
      label: Quest headset
      description: Which headset did this happen on?
      options:
        - Quest 2
        - Quest 3
        - Quest 3S
        - Quest Pro
        - Other
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: |
        List other installed mods that could be relevant.
        If none, write "None".
      placeholder: |
        Example:
        Chroma
        Noodle Extensions
        Camera2
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Anb log
      description: |
        REQUIRED: Attach the Anb log file here, or provide a direct link to the log.

        You can drag the log file into this box to upload it to GitHub.

        If using a link, make sure maintainers can access it without requesting
        permission.

        Do NOT submit an issue without a log unless you genuinely cannot obtain one.
      placeholder: |
        Attach the Anb log here, or paste a direct log URL.

        Example:
        https://example.com/my-vivify-log.txt
    validations:
      required: true

  - type: input
    id: log-time
    attributes:
      label: Approximate time of the error in the log
      description: If known, provide the timestamp or section of the log where the problem occurs.
      placeholder: "Example: 11:42:18"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / video
      description: Optional screenshots or video showing the problem.
      placeholder: "Drag screenshots/videos here or paste links."

  - type: checkboxes
    id: checks
    attributes:
      label: ☑️ Checks
      options:
        - label: I have included an Anb log or a direct link to an Anb log.
          required: true
        - label: I have searched existing issues and could not find the same problem.
          required: true
        - label: I am using a supported/recent version of Vivify Quest.
          required: true