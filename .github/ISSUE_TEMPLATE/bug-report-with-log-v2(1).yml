name: Level / Gameplay Bug
description: Report a Vivify Quest problem affecting a specific level, map, effect, or gameplay session.
title: "[BUG] "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        ## Vivify Quest Bug Report

        Please provide enough information for the problem to be reproduced and investigated.

        ### Required evidence

        This form is for reports where you can provide a Vivify log.

        You must provide either:
        - A Vivify debug/session log uploaded to this report.
        - Vivify log text pasted into the log field.
        - A direct link to an accessible Vivify log.

        If you do not have access to a PC/computer and cannot provide a Vivify log, please use the "Bug Report - No PC / No Vivify Log" form instead.

        Do not submit Android logcat in the Vivify log field.

  - type: input
    id: level
    attributes:
      label: Level(s) affected
      description: Give the name of every level/map where this happens. If it happens on every level, enter "All levels".
      placeholder: "Example: Camellia - Exit This Earth's Atomosphere"
    validations:
      required: true

  - type: textarea
    id: bug
    attributes:
      label: What happened?
      description: Clearly describe the problem and what you saw happen.
      placeholder: |
        Describe exactly what happened, what was visible, when it started,
        and anything unusual you noticed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
      description: Describe the expected behavior.
      placeholder: Explain what you expected Vivify Quest, the effect, or the level to do instead.
    validations:
      required: false

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the shortest reliable way to reproduce the problem. Include timing, map sections, settings, or actions when relevant.
      placeholder: |
        1. Open the level
        2. Start the song
        3. Reach approximately 1:32
        4. The screen becomes black
    validations:
      required: true

  - type: input
    id: vivify-version
    attributes:
      label: Vivify Quest version
      description: Enter the exact Vivify Quest version you were using.
      placeholder: "Example: 0.9.14"
    validations:
      required: true

  - type: dropdown
    id: headset
    attributes:
      label: Quest headset
      description: Which headset did this happen on?
      options:
        - Quest 2
        - Quest 3
        - Quest 3S
        - Quest Pro
        - Other
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: List other installed mods that could be relevant. If none, write "None".
      placeholder: |
        Chroma
        Noodle Extensions
        Camera2
        Mapping Extensions
    validations:
      required: true

  - type: textarea
    id: vivify-log
    attributes:
      label: Vivify debug/session log
      description: |
        REQUIRED: Attach the Vivify debug/session log as a file, paste the log text, or provide a direct link to the log.

        Enable debug mode in the Vivify mod settings if available before reproducing the issue.

        Do not submit an Android logcat file here.
      placeholder: |
        Drag the Vivify text log into this box, paste the log text,
        or provide a direct log URL.
    validations:
      required: true

  - type: textarea
    id: headset-log
    attributes:
      label: Android / headset log
      description: Optional. Attach the Android/headset log or provide a direct link.
      placeholder: Attach the Android/headset log here, or paste a direct log URL.
    validations:
      required: false

  - type: input
    id: log-time
    attributes:
      label: Approximate time of the error
      description: If known, provide the timestamp or section of the log where the problem occurs.
      placeholder: "Example: 11:42:18"

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / video
      description: Optional screenshots or video showing the problem.
      placeholder: Drag screenshots/videos here or paste links.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Required checks
      options:
        - label: I have searched existing issues and could not find the same problem.
          required: true
        - label: I am using a supported/recent version of Vivify Quest, or I have explained why I am reporting an older version.
          required: true
        - label: The information in this report is accurate to the best of my knowledge.
          required: true
