
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b32"/>
      <stop offset="1" stop-color="#080d19"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#75f4ff"/>
      <stop offset="0.5" stop-color="#35b9ff"/>
      <stop offset="1" stop-color="#657aff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="92" fill="url(#bg)"/>
  <g transform="translate(256 265) skewX(-12)">
    <text x="0" y="0"
      text-anchor="middle"
      dominant-baseline="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="82"
      font-weight="900"
      font-style="italic"
      letter-spacing="-5"
      fill="url(#logo)"
      stroke="#07101d"
      stroke-width="5"
